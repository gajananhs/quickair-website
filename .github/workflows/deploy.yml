name: Deploy to Hostinger

# Two modes:
#   check   Manual only (Actions tab -> "Deploy to Hostinger" -> Run workflow -> check).
#           Uploads nothing. Says which secrets are set (never their values), connects
#           over FTPS with them and lists the FTP account's folders, so the upload folder
#           can be confirmed against the real Hostinger account.
#   deploy  Every push to main once FTP_SERVER_DIR is set, or manually with "deploy"
#           (started from the main branch; other branches are never uploaded).
#           Builds the site and uploads dist/ over FTPS.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (hPanel -> Files -> FTP Accounts).
#     FTP_SERVER must be a hostname that matches the server's TLS certificate,
#     because the upload verifies the certificate strictly.
#   FTP_PORT  optional, 21 when not set (explicit FTPS).
#   ANTHROPIC_API_KEY  the Claude API key the "Talk to Quickair Assistant" button uses.
#
# Repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   FTP_SERVER_DIR  folder on the server to upload into, ending with /, as shown by the
#                   check run (e.g. public_html/ or ./). There is no default: until it is
#                   set, pushes to main deploy nothing, so merging this file is safe.
#
# The server must run PHP 8.2+ (required by the assistant's Composer libraries).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: check = test the FTPS login and list folders (uploads nothing); deploy = build and upload
        type: choice
        options: [check, deploy]
        default: check
      server_dir:
        description: Folder on the server to upload into (ends with /). Leave empty to use the FTP_SERVER_DIR variable.
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERVER_DIR: ${{ inputs.server_dir || vars.FTP_SERVER_DIR }}
    steps:
      - name: Which secrets are set (values are never printed)
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PORT ANTHROPIC_API_KEY; do
            if [ -n "${!name}" ]; then echo "set      $name"
            elif [ "$name" = FTP_PORT ]; then echo "not set  $name (21 will be used)"
            else echo "MISSING  $name"; missing=1; fi
          done
          echo "FTP_SERVER_DIR variable / input: ${SERVER_DIR:-(not set)}"
          [ "$missing" = 0 ] || { echo "::error::Add the missing secrets, then run the check again."; exit 1; }

      - name: Log in over FTPS and list folders (uploads nothing)
        run: |
          umask 077
          # quoted, so a user name or password with spaces, quotes or backslashes still works
          quote() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          printf 'machine %s login "%s" password "%s"\n' "$FTP_SERVER" "$(quote "$FTP_USERNAME")" "$(quote "$FTP_PASSWORD")" > "$RUNNER_TEMP/netrc"
          trap 'rm -f "$RUNNER_TEMP/netrc"' EXIT
          # --ssl-reqd: explicit FTPS (AUTH TLS) or nothing; the certificate is verified as in the upload
          list() { curl --silent --show-error --ssl-reqd --netrc-file "$RUNNER_TEMP/netrc" --list-only \
                     "ftp://$FTP_SERVER:${FTP_PORT:-21}/$1"; }

          start=$(list "") || { echo "::error::FTPS login failed (see the curl message above)."; exit 1; }
          echo "FTPS login works. The FTP account starts in a folder containing:"
          echo "$start" | sort | sed 's/^/  /'

          if echo "$start" | grep -qx 'public_html'; then
            echo "::notice::public_html is inside the starting folder: set FTP_SERVER_DIR to public_html/"
          elif echo "$start" | grep -qxE 'index\.html|index\.php|wp-config\.php|assets|wp-admin'; then
            echo "::notice::The starting folder looks like public_html itself: set FTP_SERVER_DIR to ./"
          else
            echo "::warning::public_html was not found here; look through the list above before choosing FTP_SERVER_DIR."
          fi

          if [ -n "$SERVER_DIR" ]; then
            if target=$(list "$SERVER_DIR"); then
              echo "Current upload folder '$SERVER_DIR' contains:"
              echo "$target" | sort | sed 's/^/  /'
            else
              echo "::error::The folder '$SERVER_DIR' could not be opened on the server."
              exit 1
            fi
          fi

  deploy:
    # Only the main branch is ever uploaded. Pushes to main deploy once FTP_SERVER_DIR is
    # set; manual runs need mode "deploy" and must be started from main.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && vars.FTP_SERVER_DIR != '') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
      )
    runs-on: ubuntu-latest
    # The first upload includes the assistant's PHP libraries (vendor/), which is slow over FTPS.
    timeout-minutes: 60
    env:
      SERVER_DIR: ${{ inputs.server_dir || vars.FTP_SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the upload folder
        run: |
          [ -n "$SERVER_DIR" ] || { echo "::error::Set the FTP_SERVER_DIR variable (or type a folder) after running the check mode."; exit 1; }
          case "$SERVER_DIR" in
            */) ;;
            *) echo "::error::The upload folder must end with / (got '$SERVER_DIR')."; exit 1 ;;
          esac
          case "$SERVER_DIR" in
            /*|*..*) echo "::error::The upload folder must be a relative path without '..' (got '$SERVER_DIR')."; exit 1 ;;
          esac
          echo "Uploading into: $SERVER_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install the talk button's PHP libraries
        working-directory: public/api/private
        run: |
          composer validate --no-check-publish --no-check-all
          composer install --no-dev --no-interaction --classmap-authoritative
          composer check-platform-reqs --no-dev
          rm -rf vendor/anthropic-ai/sdk/{tests,examples,scripts,fixtures}

      - run: npm run build

      - name: Give the talk button its API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY, then run this workflow again."
            exit 1
          fi
          php -r 'file_put_contents("dist/api/private/config.php", "<?php return " . var_export(["anthropic_api_key" => getenv("ANTHROPIC_API_KEY")], true) . ";\n");'

      - name: Check the build output
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # React app, routing and SEO files
          for f in index.html 404.html _pages/about.html _pages/products.html .htaccess robots.txt sitemap.xml; do
            [ -s "dist/$f" ] || fail "dist/$f is missing or empty."
          done
          grep -q 'RewriteRule \^(about)\$ _pages/' dist/.htaccess || fail "dist/.htaccess has no page routes: the prerender step did not run."
          ls dist/assets/*.js >/dev/null 2>&1 || fail "dist/assets has no JavaScript bundles."
          ls dist/assets/*.css >/dev/null 2>&1 || fail "dist/assets has no stylesheet."
          grep -q '<div id="root">' dist/index.html || fail "dist/index.html has no React root element."
          grep -q 'src="/assets/' dist/index.html || fail "dist/index.html does not load the built bundle."
          php -r '$x = simplexml_load_file("dist/sitemap.xml"); exit($x === false || count($x->url) === 0 ? 1 : 0);' \
            || fail "dist/sitemap.xml is not a valid sitemap."

          # Talk to Quickair Assistant
          for f in api/assistant.php api/private/.htaccess api/private/settings.php api/private/prompt.php \
                   api/private/config.php api/private/vendor/autoload.php; do
            [ -s "dist/$f" ] || fail "dist/$f is missing or empty."
          done
          for f in dist/api/assistant.php dist/api/private/settings.php dist/api/private/prompt.php dist/api/private/config.php; do
            php -l "$f" >/dev/null || fail "$f has a PHP syntax error."
          done
          php -r 'require "dist/api/private/vendor/autoload.php"; exit(class_exists(Anthropic\Client::class) ? 0 : 1);' \
            || fail "The Anthropic PHP SDK does not load from dist/api/private/vendor."
          php -r '$c = require "dist/api/private/config.php"; exit(is_array($c) && ($c["anthropic_api_key"] ?? "") !== "" ? 0 : 1);' \
            || fail "dist/api/private/config.php does not hold the API key."

          # The key may appear in config.php only (file names are printed, never contents).
          leaks=$(grep -rlF --exclude=config.php -- "$ANTHROPIC_API_KEY" dist || true)
          [ -z "$leaks" ] || fail "The API key appears outside config.php: $leaks"

          echo "Build output looks complete."

      - name: Upload dist/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          # Verify the server's TLS certificate instead of accepting any certificate.
          security: strict
          local-dir: dist/
          server-dir: ${{ env.SERVER_DIR }}
          # Never wipe the server folder first. Files this workflow did not upload (WordPress
          # files, the assistant's data/ counters, anything else on the host) are left alone.
          dangerous-clean-slate: false
          log-level: standard

      - run: echo "Deploy complete - ${{ github.sha }}"
