name: Deploy to Hostinger

# Manual only: run it from the Actions tab ("Run workflow").
# Needs repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD
# (hPanel -> Files -> FTP Accounts).
on:
  workflow_dispatch:
    inputs:
      server_dir:
        description: Folder on the server to upload into (must end with /)
        required: true
        default: public_html/

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ inputs.server_dir }}
      - run: echo "Deploy complete - ${{ github.sha }}"
