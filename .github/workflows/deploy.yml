name: Deploy to Hostinger

# Manual only: run it from the Actions tab ("Run workflow").
# Needs repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD
# (hPanel -> Files -> FTP Accounts) and ANTHROPIC_API_KEY (the Claude API key
# the "Talk to Quickair Assistant" button uses). The server must run PHP 8.1+.
on:
  workflow_dispatch:
    inputs:
      server_dir:
        description: Folder on the server to upload into (must end with /)
        required: true
        default: public_html/

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the talk button's PHP libraries
        working-directory: public/api/private
        run: |
          composer install --no-dev --no-interaction --classmap-authoritative
          rm -rf vendor/anthropic-ai/sdk/{tests,examples,scripts,fixtures}
      - run: npm run build
      - name: Give the talk button its API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY, then run this workflow again."
            exit 1
          fi
          php -r 'file_put_contents("dist/api/private/config.php", "<?php return " . var_export(["anthropic_api_key" => getenv("ANTHROPIC_API_KEY")], true) . ";\n");'
      - name: Upload dist/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ inputs.server_dir }}
      - run: echo "Deploy complete - ${{ github.sha }}"
