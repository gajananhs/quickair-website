<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#051b26" />
    <meta
      name="description"
      content="Quickair aluminium compressed air piping: leak-free, modular push-fit pipes and fittings for compressed air, vacuum and industrial gases. 26+ years of modular piping experience."
    />
    <link rel="icon" type="image/png" href="/qa/brand/favicon.png" />
    <title>Quickair | Aluminium Compressed Air Piping Systems</title>
    <!-- Same rule as prefersReducedMotion() in src/lib/motion.js, applied before the first paint so
         prerendered content that animates in is not shown and then hidden again when the app starts. -->
    <script>
      (function () {
        var choice = null
        try {
          var query = new URLSearchParams(location.search).get('motion')
          if (query === 'auto') sessionStorage.removeItem('quickair-motion')
          else if (query) sessionStorage.setItem('quickair-motion', query)
          choice = sessionStorage.getItem('quickair-motion')
        } catch (e) {}
        var reduce = choice === 'reduce' || (choice !== 'full' && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
        if (!reduce) document.documentElement.classList.add('motion-ok')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://voice-agent-two-topaz.vercel.app/widget.js" data-title="Quick Air Assistant" data-position="left" defer></script>
  </body>
</html>
